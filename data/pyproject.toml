[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fjordvik-data"
version = "1.0.0"
description = "Synthetic monthly emissions data for Fjordvik Manufacturing Oy, a fictional company."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["duckdb>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fjordvik-data = "fjordvik_data.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fjordvik-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) server that lets Claude query the synthetic Fjordvik emissions data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
    "duckdb>=1.5,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fjordvik-mcp = "fjordvik_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

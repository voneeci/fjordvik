[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fjordvik-service"
version = "0.1.0"
description = "After-sales service AI for Fjordvik Manufacturing Oy, a fictional company: forecasting, machine learning, scheduling, recommendations, a service assistant and an agent, on synthetic data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# Each phase adds the libraries it needs (see README.md, "The build"), pinned to a minor
# range so results reproduce (phase rule G10). Phase 2: the demand forecast. Phase 3:
# scikit-learn for the failure classifier and the isolation forest.
dependencies = [
    "numpy>=2.5,<2.6",
    "pandas>=3.1,<3.2",
    "scipy>=1.18,<1.19",
    "statsmodels>=0.14.6,<0.15",
    "scikit-learn>=1.9,<1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# statsmodels 0.14 uses a pandas helper that pandas 3.1 marks for removal; harmless here.
filterwarnings = ["ignore::DeprecationWarning:statsmodels", "ignore:Appender is deprecated"]
